spring.application.name=sharecart

# Local PostgreSQL datasource
# Make sure PostgreSQL is running locally and the database exists.
# Create it with: CREATE DATABASE sharecartdb;
spring.datasource.url=jdbc:postgresql://localhost:5432/sharecartdb;
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=docker1

# To use production DB settings, run with:
# --spring.profiles.active=prod

# JPA settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging — DEBUG for our code, INFO for everything else
logging.level.com.sharecart=DEBUG
logging.level.root=INFO

# Mailtrap Email API (token-based)
app.mailtrap.api-token=${MAILTRAP_API_TOKEN}
app.mailtrap.send-endpoint=${MAILTRAP_SEND_ENDPOINT:https://send.api.mailtrap.io/api/send}
app.mailtrap.category=${APP_MAILTRAP_CATEGORY:Account Verification}

# Email verification
app.mail.from=${APP_MAIL_FROM:no-reply@sharecart.app}
app.mail.from-name=${APP_MAIL_FROM_NAME:ShareCart}
app.mail.verify-base-url=${APP_MAIL_VERIFY_BASE_URL:http://localhost:8080/api/v1/auth/verify-email?token=}
app.mail.verification-expiry-minutes=${APP_MAIL_VERIFICATION_EXPIRY_MINUTES:30}
