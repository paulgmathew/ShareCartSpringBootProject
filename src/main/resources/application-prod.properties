# Production PostgreSQL datasource (active when profile=prod)
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Render/Supabase pooler compatibility: avoid server-side prepared statements
# that can conflict across pooled connections.
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preferQueryMode=simple

# Logging — no SQL or DEBUG noise in prod
spring.jpa.show-sql=false
logging.level.com.sharecart=INFO
logging.level.root=WARN

# Mailtrap Email API (use environment variables in production)
app.mailtrap.api-token=${MAILTRAP_API_TOKEN}
app.mailtrap.send-endpoint=${MAILTRAP_SEND_ENDPOINT:https://send.api.mailtrap.io/api/send}
app.mailtrap.category=${APP_MAILTRAP_CATEGORY:Account Verification}

# Email verification
app.mail.from=${APP_MAIL_FROM}
app.mail.from-name=${APP_MAIL_FROM_NAME:ShareCart}
app.mail.verify-base-url=${APP_MAIL_VERIFY_BASE_URL}
app.mail.verification-expiry-minutes=${APP_MAIL_VERIFICATION_EXPIRY_MINUTES:30}
